  <link rel="manifest" href="manifest.json">

  <style>
    html, body { height: 100%; margin: 0; background: #151A33; }
    #acilis { position: fixed; inset: 0; display: grid; place-content: center; gap: 14px; text-align: center;
      color: #F3F2EF; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(120% 80% at 50% 110%, #5a2a36 0%, #151A33 60%); transition: opacity .4s; }
    #acilis img { width: 112px; height: 112px; border-radius: 26px; margin: 0 auto; box-shadow: 0 12px 40px rgba(0,0,0,.45); }
    #acilis .ad { font-size: 26px; font-weight: 700; letter-spacing: .01em; }
    #acilis .ad b { color: #F0664C; font-weight: 700; }
    #acilis .gelistirici { font-size: 14px; opacity: .7; }
    #acilis .yukleniyor { margin: 18px auto 0; width: 140px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.15); overflow: hidden; }
    #acilis .yukleniyor::after { content: ""; display: block; height: 100%; width: 40%; border-radius: 2px; background: #F0664C;
      animation: kay 1.1s ease-in-out infinite; }
    @keyframes kay { from { transform: translateX(-100%); } to { transform: translateX(350%); } }
    @media (prefers-reduced-motion: reduce) { #acilis .yukleniyor::after { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <div id="acilis" role="status" aria-label="Odaklanma Zamanı yükleniyor">
    <img src="icons/Icon-512.png" alt="Odaklanma Zamanı logosu">
    <div class="ad">Odaklanma <b>Zamanı</b></div>
    <div class="gelistirici">Ahmet Sina Kurt</div>
    <div class="yukleniyor"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('acilis');
      if (el) { el.style.opacity = '0'; setTimeout(function () { el.remove(); }, 400); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
